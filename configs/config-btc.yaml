bot: trend
default_timeframe: 1h
exchange:
  id: hyperliquid
  symbol: BTC/USDC:USDC
  fee_preset: hyperliquid
  fees:
    maker_pct: 0.015
    taker_pct: 0.045
    entry: taker
    exit_stop: taker
    exit_tp: maker
timeframes:
- 15m
- 1h
- 4h
- 1d
strategy:
  ema_fast: 20
  ema_slow: 50
  supertrend:
    period: 10
    multiplier: 3.0
  bollinger:
    period: 20
    std_dev: 2.5
  volume_sma_period: 14
  enhancements:
    enabled: false
  trail_sl:
    enabled: true
    trail_start_at_pct: 1.5
    breakeven_at_pct: 0
    trail_step_pct: 0.3
    take_profit_bb: true
strategy_by_timeframe:
  15m:
    supertrend:
      period: 10
      multiplier: 3.5
  1h:
    supertrend:
      period: 10
      multiplier: 2.5
    volume_sma_period: 14
  4h:
    supertrend:
      period: 7
      multiplier: 2.5
  1d:
    ema_fast: 12
    ema_slow: 26
    supertrend:
      period: 10
      multiplier: 3.5
range_strategy:
  bollinger:
    period: 20
    std_dev: 2.0
  rsi:
    period: 14
    oversold: 35
    overbought: 65
  adx:
    period: 14
    max_for_entry: 25
    emergency_exit: 27
    rising_emergency: 22
  stop_loss_pct: 0.9
  use_swing_stop: true
  swing_lookback: 5
  swing_buffer_pct: 0.15
  entry_mode: bounce
  take_profit: middle_first
  max_bb_width_pct: 0
  min_reward_to_middle_pct: 0.25
  require_rejection_candle: true
  require_rsi_hook: true
  require_adx_flat: false
  block_counter_trend: false
  counter_trend_adx: 18
  partial_at_middle_pct: 0
  cooldown_bars: 4
  sr_filter:
    enabled: false
    lookback: 100
    pivot_window: 3
    cluster_pct: 0.5
hybrid:
  trend_adx_min: 24
  range_adx_max: 22
  trend_always: true
backtest:
  initial_balance: 100.0
  position_size_pct: 0.95
  candles_limit: 1000
  live_like: true
  intrabar_timeframe: 5m
  intrabar_exchange: binance
paper:
  poll_interval_sec: 60
  initial_balance: 100.0
  position_size_pct: 0.95
live:
  poll_interval_sec: 60
  position_size_pct: 0.95
  use_leverage_for_sizing: true
  place_bracket_orders: true
  update_bracket_orders: true
  bracket_update_every_ticks: 5
  bracket_tp_min_change_pct: 0.08
  bracket_tp_min_change_ticks: 5
  bracket_tp_mode: dynamic
  leverage: 2
  margin_mode: cross
  slippage: 0.005
  min_notional_usd: 50
  max_notional_usd: 2000
  api_timeout_sec: 60
  tick_timeout_sec: 90
  heartbeat_interval_sec: 1800
  trade_analytics_enabled: true
  trade_analytics_days: 30
  trade_analytics_interval_sec: 0
notifications:
  enabled: true
  notify_on_start: true
  notify_on_trade: true
  notify_on_error: true
