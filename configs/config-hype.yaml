bot: trend  # trend | range
default_timeframe: 1h

exchange:
  id: hyperliquid
  symbol: HYPE/USDC:USDC
  fee_preset: hyperliquid
  fees:
    maker_pct: 0.015
    taker_pct: 0.045
    entry: taker
    exit_stop: taker
    exit_tp: maker

timeframes:
  - 15m
  - 1h
  - 4h
  - 1d

strategy:
  ema_fast: 9
  ema_slow: 21
  supertrend:
    period: 7
    multiplier: 2.5
  bollinger:
    period: 20
    std_dev: 2.5
  volume_sma_period: 14
  enhancements:
    enabled: false
  trail_sl:
    enabled: true
    trail_start_at_pct: 1.5  # до +1.5% — чистый supertrend (как bracket SL)
    breakeven_at_pct: 0
    trail_step_pct: 0.3
    take_profit_bb: true       # TP по BB + trail SL

strategy_by_timeframe:
  15m:
    supertrend:
      period: 10
      multiplier: 4.0
    volume_sma_period: 14
  1h:
    ema_fast: 9
    ema_slow: 21
    supertrend:
      period: 10
      multiplier: 2.5
    bollinger:
      period: 20
      std_dev: 2.5
    volume_sma_period: 20
    enhancements:
      enabled: false
  4h:
    supertrend:
      period: 7
      multiplier: 2.5
    volume_sma_period: 14
  1d:
    ema_fast: 12
    ema_slow: 26
    supertrend:
      period: 10
      multiplier: 3.5
    volume_sma_period: 20

range_strategy:
  bollinger:
    period: 20
    std_dev: 2.0
  rsi:
    period: 14
    oversold: 35
    overbought: 65
  adx:
    period: 14
    max_for_entry: 25
    emergency_exit: 27
    rising_emergency: 22
  stop_loss_pct: 0.9
  use_swing_stop: true
  swing_lookback: 5
  swing_buffer_pct: 0.15
  entry_mode: bounce  # bounce (подтверждение) | touch (агрессивный, лучше на 4h)
  take_profit: middle_first
  max_bb_width_pct: 0
  min_reward_to_middle_pct: 0.25
  require_rejection_candle: true
  require_rsi_hook: true
  require_adx_flat: false
  block_counter_trend: false
  counter_trend_adx: 18
  partial_at_middle_pct: 0
  cooldown_bars: 4
  sr_filter:
    enabled: false
    lookback: 100
    pivot_window: 3
    cluster_pct: 0.5

hybrid:
  trend_adx_min: 24
  range_adx_max: 22
  trend_always: true

backtest:
  initial_balance: 100.0
  position_size_pct: 0.95
  candles_limit: 1000
  live_like: true
  intrabar_timeframe: 5m

paper:
  poll_interval_sec: 60
  initial_balance: 100.0
  position_size_pct: 0.95

live:
  poll_interval_sec: 60
  position_size_pct: 0.95
  use_leverage_for_sizing: true  # номинал ≈ balance × leverage × 95% (до max_notional_usd)
  place_bracket_orders: true
  update_bracket_orders: true
  bracket_update_every_ticks: 5   # ~5 мин при poll 60s — как 5m intrabar в бэктесте
  bracket_tp_min_change_pct: 0.15 # ~$0.09 на HYPE ~60; BB сдвинулась на 0.2%+ → обновить TP
  bracket_tp_min_change_ticks: 3  # запасной порог: 3 тика (~$0.03)
  bracket_tp_mode: dynamic        # long: TP следует за bb_upper вверх (как take_profit_bb в бэктесте)
  leverage: 2
  margin_mode: cross
  slippage: 0.005
  min_notional_usd: 50
  max_notional_usd: 500
  api_timeout_sec: 60
  tick_timeout_sec: 90
  heartbeat_interval_sec: 1800
  trade_analytics_enabled: true
  trade_analytics_days: 30
  trade_analytics_interval_sec: 0  # только при старте; 21600 = каждые 6ч в heartbeat

notifications:
  enabled: true
  notify_on_start: true
  notify_on_trade: true
  notify_on_error: true
